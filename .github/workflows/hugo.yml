name: Build and Deploy Hugo
on:
  push:
    branches:
      - main
permissions:
    contents: read
    pages: write
    id-token: write
concurrency:
    group: "pages"
    cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
            submodules: true
            fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
            hugo-version: 'latest'
            extended: true
      - name: Build site
        run: hugo --minify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
            path: ./public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4